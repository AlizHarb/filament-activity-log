name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            testbench: '^10.0'
            filament: '^4.2'
            spatie: '^4.0'
            stability: prefer-lowest
          - php: '8.3'
            testbench: '^10.0'
            filament: '^4.2'
            spatie: '^4.0'
            stability: prefer-stable
          - php: '8.4'
            testbench: '^10.0'
            filament: '^5.0'
            spatie: '^4.0'
            stability: prefer-stable
          - php: '8.4'
            testbench: '^11.0'
            filament: '^5.0'
            spatie: '^5.0'
            stability: prefer-stable
          - php: '8.5'
            testbench: '^11.0'
            filament: '^5.0'
            spatie: '^5.0'
            stability: prefer-stable

    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }} / Filament ${{ matrix.filament }} / Spatie ${{ matrix.spatie }} / ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none
      - run: composer require "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" "spatie/laravel-activitylog:${{ matrix.spatie }}" --no-interaction --no-update
      - run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction
      - run: vendor/bin/pest
      - if: matrix.php == '8.5'
        run: composer audit --locked
